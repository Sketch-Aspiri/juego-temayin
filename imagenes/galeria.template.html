<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temayin · Biblioteca de arte</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10271f;color:#f4efdc;font:16px system-ui,sans-serif}
header{padding:40px 5vw 26px;border-bottom:1px solid #526b57;background:#193b2b}
h1{font:700 clamp(30px,4vw,50px) Georgia,serif;margin:0 0 12px;color:#f3cf79}p{line-height:1.6;margin:8px 0}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button,input,select{font:inherit;border:1px solid #a8b697;border-radius:6px;padding:10px 14px;background:#f5eed9;color:#163425}
button{cursor:pointer}button[aria-pressed=true]{background:#f3cf79}input{min-width:220px}main{padding:25px 5vw 50px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}.card{border:1px solid #536b54;background:#1c392b;border-radius:8px;overflow:hidden}
.preview{display:block;width:100%;height:225px;object-fit:contain;padding:10px;background-color:#d5d6ce;background-image:conic-gradient(#f1f1e7 25%,transparent 0 50%,#f1f1e7 0 75%,transparent 0);background-size:20px 20px}
.info{padding:17px}.info h2{font-size:19px;margin:0 0 8px;overflow-wrap:anywhere}.tag{color:#eed491;font-size:13px;text-transform:uppercase;letter-spacing:.06em}.info p{font-size:14px;color:#ccdbca}a{color:#f7d383;text-underline-offset:4px}.links{display:flex;gap:16px;flex-wrap:wrap}
dialog{width:min(1100px,94vw);border:1px solid #9bab92;border-radius:10px;background:#f1eddf;color:#183225;padding:22px}dialog::backdrop{background:#07110de6}.viewer{max-width:100%;max-height:66vh;object-fit:contain;background:#d4d6d2;background-image:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0);background-size:24px 24px}.dialog-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}canvas{max-width:100%;height:auto;border:1px solid #b6c0ad;margin-top:12px;background:#def0df}.notice{border-left:3px solid #f3cf79;padding-left:12px}footer{font-size:14px;color:#bdcbb8;padding-top:32px}
</style>
<header><p class="tag">Temayin · La Aventura del Jaguar</p><h1>Biblioteca de arte</h1><p>Sprites, personajes, paisajes y objetos del viaje. Abre una hoja para revisar sus poses y transparencia.</p><p id="count" aria-live="polite"></p><nav aria-label="Filtros"><input id="search" type="search" placeholder="Buscar nombre…" aria-label="Buscar imágenes"><select id="category" aria-label="Categoría"><option value="">Todas las categorías</option></select></nav></header>
<main><p id="missing" class="notice" hidden></p><div id="grid"></div><footer>Arte generado con image_gen integrado. Los PNG fuente y prompts están en esta carpeta; el catálogo indica las copias para el juego.</footer></main>
<dialog id="viewer"><div class="dialog-head"><h2 id="name"></h2><button id="close">Cerrar</button></div><img id="full" class="viewer" alt=""><p id="detail"></p><div id="frames" hidden><label>Pose <select id="frame"></select></label><br><canvas id="crop" width="600" height="340"></canvas></div></dialog>
<script id="catalog" type="application/json">__CATALOG__</script>
<script>
const catalog=JSON.parse(document.getElementById('catalog').textContent);
const labels={enemigos:'Enemigos',jefes:'Jefes',paisajes:'Paisajes',personajes:'Personajes',objetos:'Objetos',mecanicas:'Mecánicas',complementos:'Complementos',escenarios:'Decorados de arenas',proyectiles:'Proyectiles y ondas',actualizados:'Arte actualizado'};
const category=document.getElementById('category'),search=document.getElementById('search'),grid=document.getElementById('grid'),dialog=document.getElementById('viewer');
for(const key of Object.keys(labels)){const option=new Option(labels[key],key);category.add(option)}
const pending=document.getElementById('missing');if(catalog.missing.length){pending.hidden=false;pending.textContent='En preparación: '+catalog.missing.join(', ')}
let current=null,sequence=[];
function getFrames(asset){const meta=asset.metadata;if(!meta)return[];if(Array.isArray(meta.frames))return meta.frames;let all=[];for(const [kind,poses] of Object.entries(meta)){if(['run','dead','hit'].includes(kind)&&Array.isArray(poses))all.push(...poses.map((r,i)=>({state:kind+' '+(i+1),x:r[0],y:r[1],width:r[2],height:r[3]})))}return all}
function drawFrame(){const canvas=document.getElementById('crop'),ctx=canvas.getContext('2d'),r=sequence[Number(document.getElementById('frame').value)],img=document.getElementById('full');ctx.clearRect(0,0,canvas.width,canvas.height);if(!r||!img.complete)return;const s=Math.min(540/r.width,290/r.height);ctx.drawImage(img,r.x,r.y,r.width,r.height,(600-r.width*s)/2,(340-r.height*s)/2,r.width*s,r.height*s)}
function open(asset){current=asset;document.getElementById('name').textContent=asset.id;const img=document.getElementById('full');img.alt=asset.id;img.onload=drawFrame;img.src=asset.image;document.getElementById('detail').textContent=asset.width+' × '+asset.height+' · '+(asset.alpha?'Fondo transparente':'Fondo opaco')+(asset.notes?' · '+asset.notes:'');sequence=getFrames(asset);const select=document.getElementById('frame');select.replaceChildren();sequence.forEach((r,i)=>select.add(new Option(r.state||'Pose '+(i+1),i)));document.getElementById('frames').hidden=!sequence.length;dialog.showModal();drawFrame()}
function render(){grid.replaceChildren();const filtered=catalog.assets.filter(a=>(!category.value||a.category===category.value)&&a.id.toLowerCase().includes(search.value.toLowerCase()));document.getElementById('count').textContent=filtered.length+' imágenes de '+catalog.assets.length;for(const a of filtered){const card=document.createElement('article');card.className='card';const image=document.createElement('img');image.src=a.image;image.alt=a.id;image.loading='lazy';image.className='preview';const info=document.createElement('div');info.className='info';const tag=document.createElement('span');tag.className='tag';tag.textContent=labels[a.category];const title=document.createElement('h2');title.textContent=a.id;const size=document.createElement('p');size.textContent=a.width+' × '+a.height+' · '+(a.alpha?'Transparente':'Opaco');const links=document.createElement('div');links.className='links';const button=document.createElement('button');button.textContent='Ver hoja';button.onclick=()=>open(a);const download=document.createElement('a');download.href=a.image;download.download=a.id+'.png';download.textContent='PNG';links.append(button,download);if(a.atlas){const atlas=document.createElement('a');atlas.href=a.atlas;atlas.textContent='Recortes';links.append(atlas)}if(a.prompt){const prompt=document.createElement('a');prompt.href=a.prompt;prompt.textContent='Prompt';links.append(prompt)}info.append(tag,title,size,links);card.append(image,info);grid.append(card)}}
category.onchange=render;search.oninput=render;document.getElementById('close').onclick=()=>dialog.close();document.getElementById('frame').onchange=drawFrame;render();
</script>
</html>
